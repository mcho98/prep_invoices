name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]   # e.g. git tag v1.0 && git push --tags  -> also publishes a Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: python build_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: PrepInvoices-Windows
          path: dist/PrepInvoices.exe

  mac:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: python build_app.py
      - name: Make disk image
        run: |
          mkdir dmg && cp -R dist/PrepInvoices.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Prep Invoices" -srcfolder dmg -ov -format UDZO PrepInvoices-Mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: PrepInvoices-Mac
          path: PrepInvoices-Mac.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: files/* }
